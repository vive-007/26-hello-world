<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private — members only</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; }
    input, button { font-size: 1rem; padding: 0.5rem; margin-top: 0.5rem; width: 100%; box-sizing: border-box; }
    button { cursor: pointer; }
    #content { display: none; margin-top: 1rem; border: 1px solid #ccc; padding: 1rem; }
    #status { min-height: 1.5em; }
    #notes { list-style: none; padding: 0; }
    #notes li { border-bottom: 1px solid #eee; padding: 0.4rem 0; }
  </style>
</head>
<body>
  <h1>Private page</h1>
  <p><a href="./hello.html">Hello</a> · <a href="./flutter_web/">Flutter app (same notes)</a></p>
  <p id="status">Checking login…</p>
  <form id="loginForm" style="display:none">
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <button id="logoutBtn" style="display:none">Sign out</button>
  <div id="content">
    <h2>My notes</h2>
    <ul id="notes"></ul>
    <form id="noteForm">
      <input id="noteInput" type="text" placeholder="New note" required>
      <button type="submit">Add note</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://wvtdntsyncjvovvrxktw.supabase.co";
    // Public publishable key only — never put the secret key here.
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_iw2WE40zKKOr89394OEPfQ_2L-fDyRy";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const status = document.getElementById('status');
    const loginForm = document.getElementById('loginForm');
    const logoutBtn = document.getElementById('logoutBtn');
    const content = document.getElementById('content');
    const notesUl = document.getElementById('notes');

    function showSignedOut(msg) {
      status.textContent = msg || 'Not signed in.';
      loginForm.style.display = '';
      logoutBtn.style.display = 'none';
      content.style.display = 'none';
    }
    async function showSignedIn(email) {
      status.textContent = `Signed in${email ? ' as ' + email : ''}`;
      loginForm.style.display = 'none';
      logoutBtn.style.display = '';
      content.style.display = 'block';
      await loadNotes();
    }

    async function loadNotes() {
      const { data, error } = await client
        .from('private_notes')
        .select('id,content,created_at')
        .order('created_at', { ascending: false });
      if (error) { status.textContent = 'Could not load notes: ' + error.message; return; }
      notesUl.innerHTML = '';
      for (const n of data) {
        const li = document.createElement('li');
        li.textContent = n.content;
        notesUl.appendChild(li);
      }
    }

    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      status.textContent = 'Signing in…';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { data, error } = await client.auth.signInWithPassword({ email, password });
      if (error) { showSignedOut('Login failed: ' + error.message); return; }
      showSignedIn(data.user?.email);
    };
    logoutBtn.onclick = async () => { await client.auth.signOut(); showSignedOut(); };

    document.getElementById('noteForm').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('noteInput');
      const { error } = await client.from('private_notes').insert({ content: input.value.trim() });
      if (error) { status.textContent = 'Could not save: ' + error.message; return; }
      input.value = '';
      await loadNotes();
    };

    (async () => {
      const { data } = await client.auth.getSession();
      const email = data.session?.user?.email;
      if (email) showSignedIn(email);
      else showSignedOut();
    })();
  </script>
</body>
</html>
